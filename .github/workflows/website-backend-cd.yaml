name: Website Backend CD

# Builds eventsnap-website-backend/Dockerfile and publishes the image to
# GitHub Container Registry:
#   ghcr.io/${{ github.repository_owner }}/eventsnap-website-backend
# Tags: latest (main), sha-<short commit>. A host only needs to pull it:
#   docker pull ghcr.io/praveen8722/eventsnap-website-backend:latest

on:
  push:
    branches: [ main ]
    paths:
      - 'eventsnap-website-backend/**'
      - '.github/workflows/website-backend-cd.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: "Build & push image (GHCR)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Registry paths must be lowercase; the owner name may not be.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eventsnap-website-backend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: eventsnap-website-backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=website-backend
          cache-to: type=gha,mode=max,scope=website-backend
