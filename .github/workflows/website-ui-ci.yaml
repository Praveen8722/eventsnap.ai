name: Website UI CI

on:
  push:
    branches: [ main, 'feature/**' ]
    paths:
      - 'eventsnap-website-ui/**'
      - '.github/workflows/website-ui-ci.yaml'
  pull_request:
    branches: [ main, 'feature/**' ]
    paths:
      - 'eventsnap-website-ui/**'
      - '.github/workflows/website-ui-ci.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: "Typecheck & Build (Vite)"
    runs-on: ubuntu-latest

    # This repo holds four projects; the website UI lives in its own folder.
    defaults:
      run:
        working-directory: eventsnap-website-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: eventsnap-website-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: eventsnap-website-ui/dist/
          if-no-files-found: error
          retention-days: 7
